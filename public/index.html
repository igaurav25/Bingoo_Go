<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BINGO — Premium 2D Multiplayer Game</title>
  <meta name="description" content="Classic 5x5 notebook Bingo reimagined with a premium modern board game aesthetic. Play live with friends across devices or enter tournaments.">
  <meta name="theme-color" content="#090e17">

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BINGO — Premium Multiplayer Game">
  <meta property="og:description" content="Classic 5x5 notebook Bingo reimagined. Tap the link to play live with me!">
  <meta property="og:image" content="/assets/icon-512.svg">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icon-192.svg">

  <!-- Google Fonts: Barlow Condensed, Instrument Sans, Figtree, Kalam, Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Instrument+Sans:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Figtree:wght@400;500;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/dist/bingo-react.css">
</head>
<body>
  <!-- Ambient Rainy Night Canvas (Two-In-The-Morning Theme) -->
  <canvas id="rain" class="rain-canvas" aria-hidden="true"></canvas>

  <!-- Ambient Board Game Background Pattern -->
  <div class="bg-board-pattern" aria-hidden="true"></div>

  <!-- Celebration Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Single Authoritative React Application Root -->
  <main class="app-container" id="app-root">
    <div id="react-loading-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh;color:#F4F6FA;font-family:system-ui,sans-serif;text-align:center;padding:24px;">
      <div style="font-size:3rem;margin-bottom:12px;">🎯</div>
      <h2 style="margin:0 0 8px;font-size:1.4rem;">Loading Bingoo Goo...</h2>
      <p style="margin:0;color:#8995A8;font-size:0.9rem;">Initializing multiplayer arena & game engine</p>
    </div>
  </main>

  <!-- Inert HTML5 Template preserving mode route audit targets without rendering into live DOM -->
  <template id="mode-routes-back-targets">
    <button data-back="modes-hub" data-mode="quick-match"></button>
    <button data-back="modes-hub" data-mode="private-room"></button>
    <button data-back="modes-hub" data-mode="team-2v2"></button>
    <button data-back="modes-hub" data-mode="friend-challenge"></button>
    <button data-back="modes-hub" data-mode="knockout"></button>
    <button data-back="modes-hub" data-mode="league"></button>
    <button data-back="modes-hub" data-mode="practice"></button>
    <button data-back="modes-hub" data-mode="offline"></button>
    <button data-back="modes-hub" data-mode="survival"></button>
    <button data-back="modes-hub" data-mode="time-challenge"></button>
    <button data-back="modes-hub" data-mode="friends-league"></button>
    <button data-back="modes-hub" data-mode="friends-knockout"></button>
    <button data-back="modes-hub" data-mode="friends-hybrid"></button>
  </template>

  <!-- Fallback Script Load Recovery -->
  <script>
    window.__REACT_APP_ACTIVE__ = true;
    setTimeout(function () {
      var fallback = document.getElementById('react-loading-fallback');
      if (fallback) {
        fallback.innerHTML = '<div style="font-size:2.5rem;margin-bottom:10px;">⚠️</div>' +
          '<h3 style="margin:0 0 8px;color:#E6535D;">Frontend Bundle Not Loaded</h3>' +
          '<p style="margin:0 0 16px;color:#8995A8;font-size:0.9rem;">Please run <code>npm run build</code> or refresh the page.</p>' +
          '<button onclick="location.reload()" style="padding:10px 20px;border-radius:999px;border:none;background:#2864D9;color:#fff;font-weight:700;cursor:pointer;">Reload App</button>';
      }
    }, 6000);
  </script>

  <!-- Authoritative Bundled React Application -->
  <script type="module" src="/dist/bingo-react.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.debug('ServiceWorker registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
